name: 构建并推送 Docker 镜像

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: baoxinwen/meme-maker

permissions:
  contents: read

# 并发推送 main 时排队而非并行构建，避免 latest manifest 交错
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 启用 Corepack
        run: corepack enable

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 审计生产依赖（npm 官方源）
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org/

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 运行全部检查
        run: pnpm check:ci
        env:
          MEME_MAKER_E2E_PRODUCTION: "1"

  build-and-push:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 QEMU（多架构支持）
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 登录 GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出构建镜像摘要
        run: echo "digest=${{ steps.build.outputs.digest }}"
